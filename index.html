<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uredi računalniško namizje</title>
  <style>
    :root {
      --ink: #182943;
      --muted: #607087;
      --blue: #315fbd;
      --blue-dark: #23478f;
      --blue-soft: #e5efff;
      --line: #d5dfec;
      --good: #236e40;
      --good-bg: #e7f6ec;
      --bad: #a13d29;
      --bad-bg: #fff0eb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      background: #edf3f9;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button { font: inherit; }
    [hidden] { display: none !important; }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .page-head {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(31px, 5vw, 46px);
      line-height: 1.08;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .stats {
      display: flex;
      flex: 0 0 auto;
      gap: 10px;
    }

    .stat {
      min-width: 115px;
      padding: 11px 14px;
      border: 1px solid #cbd7e7;
      border-radius: 11px;
      background: #fff;
      color: #40516a;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .card {
      padding: clamp(19px, 3vw, 32px);
      border: 1px solid var(--line);
      border-radius: 19px;
      background: #fff;
      box-shadow: 0 13px 38px rgba(31, 53, 88, .08);
    }

    .task-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px 15px;
      align-items: center;
      margin-bottom: 19px;
    }

    .task-type {
      display: inline-flex;
      padding: 8px 12px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--blue-soft);
      color: #254b94;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .instruction {
      font-size: clamp(18px, 2.5vw, 22px);
      line-height: 1.45;
    }

    .target {
      display: inline-block;
      margin: 0 3px;
      padding: 2px 9px;
      border-radius: 7px;
      background: #dce8ff;
      color: #21478f;
      font-weight: 800;
    }

    .desktop-frame {
      overflow-x: auto;
      border: 4px solid #263952;
      border-radius: 13px;
      background: #263952;
      box-shadow: 0 10px 24px rgba(25, 43, 68, .18);
    }

    .desktop {
      position: relative;
      width: 100%;
      min-width: 830px;
      height: 505px;
      overflow: hidden;
      border-radius: 8px;
      background:
        radial-gradient(circle at 78% 18%, rgba(255,255,255,.25), transparent 25%),
        linear-gradient(145deg, #3576b6 0%, #184e84 48%, #123b66 100%);
      user-select: none;
    }

    .desktop::before {
      position: absolute;
      right: -80px;
      bottom: 40px;
      width: 430px;
      height: 230px;
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(255,255,255,.035), 0 0 0 75px rgba(255,255,255,.025);
      content: "";
      transform: rotate(-18deg);
    }

    .icon-grid {
      position: absolute;
      top: 20px;
      left: 18px;
      display: grid;
      grid-template-columns: repeat(6, 108px);
      grid-template-rows: repeat(2, 130px);
      gap: 20px 22px;
    }

    .desktop-icon {
      position: relative;
      display: flex;
      width: 108px;
      height: 130px;
      padding: 8px 5px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #fff;
      cursor: default;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
    }

    .desktop-icon:hover,
    .desktop-icon.selected {
      border-color: rgba(217,235,255,.8);
      background: rgba(155,202,244,.25);
    }

    .desktop-icon.dragging { opacity: .45; }
    .desktop-icon.moved { visibility: hidden; }
    .desktop-icon.drop-ready {
      border-color: #fff;
      background: rgba(122,211,158,.45);
      transform: scale(1.05);
    }

    .desktop-icon.accepted {
      border-color: #9df0b8;
      background: rgba(72,174,109,.48);
    }

    .icon-picture {
      position: relative;
      display: block;
      width: 58px;
      height: 62px;
      margin-bottom: 7px;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,.22));
      pointer-events: none;
    }

    .folder-shape {
      position: absolute;
      right: 1px;
      bottom: 2px;
      left: 1px;
      height: 46px;
      border: 1px solid #d89b18;
      border-radius: 5px;
      background: linear-gradient(#ffd875, #eeb53c);
    }

    .folder-shape::before {
      position: absolute;
      top: -10px;
      left: 4px;
      width: 27px;
      height: 12px;
      border: 1px solid #d89b18;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      background: #f2bf4d;
      content: "";
    }

    .file-shape {
      position: absolute;
      inset: 1px 5px;
      border: 1px solid #c9d4e4;
      border-radius: 4px;
      background: linear-gradient(135deg, #fff 0 78%, #e2e9f3 78%);
    }

    .file-shape::before,
    .file-shape::after {
      position: absolute;
      right: 9px;
      left: 9px;
      height: 3px;
      border-radius: 2px;
      background: #c8d3e2;
      content: "";
    }

    .file-shape::before { top: 17px; }
    .file-shape::after { top: 25px; }

    .file-badge {
      position: absolute;
      right: 0;
      bottom: 5px;
      left: 0;
      width: 48px;
      margin: auto;
      padding: 3px 2px;
      border-radius: 4px;
      background: #426fc9;
      color: #fff;
      font: 800 10px/1 Arial, sans-serif;
      text-align: center;
    }

    .badge-image { background: #4b9b68; }
    .badge-audio { background: #9a5fbd; }
    .badge-video { background: #c05a55; }
    .badge-sheet { background: #27805a; }

    .icon-name {
      display: block;
      width: 100%;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.25;
      pointer-events: none;
    }

    .selection-box {
      position: absolute;
      z-index: 15;
      border: 1px solid #c7e5ff;
      background: rgba(136, 197, 247, .28);
      pointer-events: none;
    }

    .taskbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      display: flex;
      height: 43px;
      padding: 0 14px;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 30, 49, .9);
      color: #fff;
      font-size: 13px;
    }

    .start-button {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      background: rgba(255,255,255,.1);
    }

    .start-mark {
      display: grid;
      width: 14px;
      height: 14px;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
    }

    .start-mark i { background: #ddecff; }

    .folder-window {
      position: absolute;
      z-index: 30;
      top: 105px;
      left: 50%;
      width: 430px;
      border: 1px solid #7a8da7;
      border-radius: 9px;
      background: #fff;
      color: #23344d;
      box-shadow: 0 16px 35px rgba(8, 24, 43, .35);
      transform: translateX(-50%);
      text-shadow: none;
    }

    .window-title {
      padding: 11px 14px;
      border-bottom: 1px solid #d6e0eb;
      border-radius: 9px 9px 0 0;
      background: #f0f4f9;
      font-weight: 700;
    }

    .window-body {
      min-height: 120px;
      padding: 25px;
      color: #66768b;
      text-align: center;
    }

    .context-menu {
      position: absolute;
      z-index: 40;
      width: 175px;
      padding: 6px;
      border: 1px solid #aeb9c8;
      border-radius: 7px;
      background: #fff;
      color: #273950;
      box-shadow: 0 10px 25px rgba(8, 24, 43, .32);
      text-shadow: none;
    }

    .context-menu button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .context-menu button:hover,
    .context-menu button:focus { background: #e6efff; outline: none; }

    .feedback {
      min-height: 61px;
      margin: 18px 0 13px;
      padding: 15px 16px;
      border-radius: 10px;
      background: #f1f4f8;
      color: #536178;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
    }

    .feedback.good { background: var(--good-bg); color: var(--good); }
    .feedback.bad { background: var(--bad-bg); color: var(--bad); }

    .footer {
      display: flex;
      min-height: 47px;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }

    .help {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .next-button {
      flex: 0 0 auto;
      padding: 13px 21px;
      border: 0;
      border-radius: 9px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .next-button:hover { background: var(--blue-dark); }
    .next-button:focus-visible { outline: 3px solid #92afea; outline-offset: 3px; }

    @media (max-width: 680px) {
      body { padding: 22px 10px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .task-row { grid-template-columns: 1fr; }
      .footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-head">
      <div>
        <h1>Uredi računalniško namizje</h1>
        <p class="subtitle">Vadi klikanje, vlečenje, označevanje in delo z mapami.</p>
      </div>
      <div class="stats">
        <div class="stat" id="score">Pravilno: 0</div>
        <div class="stat" id="mistakes">Napake: 0</div>
      </div>
    </header>

    <section class="card" aria-label="Igra urejanja računalniškega namizja">
      <div class="task-row">
        <span class="task-type" id="taskType"></span>
        <div class="instruction" id="instruction"></div>
      </div>

      <div class="desktop-frame">
        <div class="desktop" id="desktop" aria-label="Simulirano računalniško namizje">
          <div class="icon-grid" id="iconGrid"></div>
          <div class="taskbar">
            <span class="start-button" aria-hidden="true"><span class="start-mark"><i></i><i></i><i></i><i></i></span></span>
            <span>Mišji izzivi</span>
          </div>
        </div>
      </div>

      <div class="feedback" id="feedback" role="status" aria-live="polite">Preberi navodilo in reši nalogo.</div>

      <div class="footer">
        <p class="help" id="help"></p>
        <button class="next-button" id="nextButton" type="button">Druga naloga</button>
      </div>
    </section>
  </main>

  <script>
    'use strict';

    const desktopItems = [
      { id: 'documents', name: 'Dokumenti', kind: 'folder' },
      { id: 'pictures', name: 'Slike', kind: 'folder' },
      { id: 'music', name: 'Glasba', kind: 'folder' },
      { id: 'videos', name: 'Videi', kind: 'folder' },
      { id: 'homework', name: 'Domaca_naloga.docx', kind: 'file', folder: 'documents', badge: 'DOCX', badgeClass: '' },
      { id: 'schedule', name: 'Urnik.xlsx', kind: 'file', folder: 'documents', badge: 'XLSX', badgeClass: 'badge-sheet' },
      { id: 'trip', name: 'Izlet.jpg', kind: 'file', folder: 'pictures', badge: 'JPG', badgeClass: 'badge-image' },
      { id: 'drawing', name: 'Risba.png', kind: 'file', folder: 'pictures', badge: 'PNG', badgeClass: 'badge-image' },
      { id: 'song', name: 'Pesem.mp3', kind: 'file', folder: 'music', badge: 'MP3', badgeClass: 'badge-audio' },
      { id: 'interview', name: 'Intervju.wav', kind: 'file', folder: 'music', badge: 'WAV', badgeClass: 'badge-audio' },
      { id: 'film', name: 'Film.mp4', kind: 'file', folder: 'videos', badge: 'MP4', badgeClass: 'badge-video' },
      { id: 'animation', name: 'Animacija.mov', kind: 'file', folder: 'videos', badge: 'MOV', badgeClass: 'badge-video' }
    ];

    const taskInfo = {
      click: {
        label: 'Enojni klik',
        help: 'Enkrat pritisni in spusti levi gumb miške na zahtevani ikoni.'
      },
      double: {
        label: 'Dvoklik',
        help: 'Na zahtevani mapi dvakrat hitro pritisni levi gumb miške.'
      },
      drag: {
        label: 'Povleci in spusti',
        help: 'Datoteko primi z levim gumbom, jo povleci na mapo in tam spusti.'
      },
      box: {
        label: 'Označi več ikon',
        help: 'Začni na praznem delu namizja. Drži levi gumb in nariši pravokotnik okoli zahtevanih ikon.'
      },
      context: {
        label: 'Desni klik',
        help: 'Na zahtevani ikoni pritisni desni gumb miške, nato izberi ukaz.'
      }
    };

    const selectionPairs = [
      ['documents', 'pictures'],
      ['music', 'videos'],
      ['homework', 'schedule'],
      ['trip', 'drawing'],
      ['song', 'interview'],
      ['film', 'animation']
    ];

    const contextActions = ['Odpri', 'Preimenuj', 'Kopiraj', 'Lastnosti'];
    const taskKinds = ['click', 'double', 'drag', 'box', 'context'];

    const desktop = document.getElementById('desktop');
    const iconGrid = document.getElementById('iconGrid');
    const instruction = document.getElementById('instruction');
    const taskType = document.getElementById('taskType');
    const feedback = document.getElementById('feedback');
    const help = document.getElementById('help');
    const nextButton = document.getElementById('nextButton');
    const scoreElement = document.getElementById('score');
    const mistakesElement = document.getElementById('mistakes');

    let currentTask = null;
    let taskDeck = [];
    let solved = false;
    let score = 0;
    let mistakes = 0;
    let selectionState = null;

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setFeedback(message, kind = '') {
      feedback.textContent = message;
      feedback.className = 'feedback' + (kind ? ' ' + kind : '');
    }

    function markWrong(message = 'Poskusi znova.') {
      if (solved) return;
      mistakes += 1;
      mistakesElement.textContent = 'Napake: ' + mistakes;
      setFeedback(message, 'bad');
    }

    function completeTask(message = '') {
      if (solved) return;
      solved = true;
      score += 1;
      scoreElement.textContent = 'Pravilno: ' + score;
      const praise = ['Odlično!', 'Bravo!', 'Pravilno!', 'Zelo dobro!'];
      setFeedback(message || randomItem(praise), 'good');
      nextButton.textContent = 'Naslednja naloga';
    }

    function createIcon(item) {
      const icon = document.createElement('div');
      icon.className = 'desktop-icon';
      icon.dataset.id = item.id;
      icon.dataset.kind = item.kind;
      icon.tabIndex = 0;
      icon.setAttribute('role', 'button');
      icon.setAttribute('aria-label', item.name);

      const picture = document.createElement('span');
      picture.className = 'icon-picture';
      if (item.kind === 'folder') {
        const shape = document.createElement('span');
        shape.className = 'folder-shape';
        picture.append(shape);
      } else {
        const shape = document.createElement('span');
        shape.className = 'file-shape';
        const badge = document.createElement('span');
        badge.className = 'file-badge ' + item.badgeClass;
        badge.textContent = item.badge;
        picture.append(shape, badge);
      }

      const name = document.createElement('span');
      name.className = 'icon-name';
      name.textContent = item.name;
      icon.append(picture, name);
      return icon;
    }

    function renderDesktop() {
      iconGrid.replaceChildren();
      desktop.querySelectorAll('.folder-window, .context-menu, .selection-box').forEach(element => element.remove());
      desktopItems.forEach(item => iconGrid.append(createIcon(item)));
    }

    function itemById(id) {
      return desktopItems.find(item => item.id === id);
    }

    function iconById(id) {
      return iconGrid.querySelector('[data-id="' + id + '"]');
    }

    function clearSelectedIcons() {
      iconGrid.querySelectorAll('.selected').forEach(icon => icon.classList.remove('selected'));
    }

    function nextTaskKind() {
      if (taskDeck.length === 0) taskDeck = shuffle(taskKinds);
      return taskDeck.pop();
    }

    function newTask() {
      solved = false;
      nextButton.textContent = 'Druga naloga';
      selectionState = null;
      renderDesktop();

      const kind = nextTaskKind();
      taskType.textContent = taskInfo[kind].label;
      help.textContent = taskInfo[kind].help;
      setFeedback('Preberi navodilo in reši nalogo.');

      if (kind === 'click') setupClickTask();
      if (kind === 'double') setupDoubleClickTask();
      if (kind === 'drag') setupDragTask();
      if (kind === 'box') setupBoxSelectionTask();
      if (kind === 'context') setupContextTask();
    }

    function setupClickTask() {
      const target = randomItem(desktopItems);
      currentTask = { kind: 'click', targetId: target.id };
      instruction.innerHTML = 'Z enim klikom izberi ikono <span class="target">' + target.name + '</span>.';

      iconGrid.querySelectorAll('.desktop-icon').forEach(icon => {
        icon.addEventListener('click', () => {
          if (solved) return;
          clearSelectedIcons();
          icon.classList.add('selected');
          if (icon.dataset.id === target.id) completeTask();
          else markWrong('To ni zahtevana ikona. Poskusi znova.');
        });
      });
    }

    function setupDoubleClickTask() {
      const folders = desktopItems.filter(item => item.kind === 'folder');
      const target = randomItem(folders);
      currentTask = { kind: 'double', targetId: target.id };
      instruction.innerHTML = 'Z dvoklikom odpri mapo <span class="target">' + target.name + '</span>.';

      iconGrid.querySelectorAll('.desktop-icon').forEach(icon => {
        icon.addEventListener('click', () => {
          clearSelectedIcons();
          icon.classList.add('selected');
        });
        icon.addEventListener('dblclick', event => {
          event.preventDefault();
          if (solved) return;
          if (icon.dataset.id !== target.id) {
            markWrong('Odprl si napačno ikono. Poskusi znova.');
            return;
          }
          openFolderWindow(target.name);
          completeTask('Odlično! Odprl si pravo mapo.');
        });
      });
    }

    function openFolderWindow(folderName) {
      const windowElement = document.createElement('div');
      windowElement.className = 'folder-window';
      windowElement.innerHTML =
        '<div class="window-title">' + folderName + '</div>' +
        '<div class="window-body">Mapa je odprta.</div>';
      desktop.append(windowElement);
    }

    function setupDragTask() {
      const files = desktopItems.filter(item => item.kind === 'file');
      const file = randomItem(files);
      const folder = itemById(file.folder);
      currentTask = { kind: 'drag', targetId: file.id, folderId: folder.id };
      instruction.innerHTML = 'Datoteko <span class="target">' + file.name + '</span> povleci v mapo <span class="target">' + folder.name + '</span>.';

      const fileIcon = iconById(file.id);
      fileIcon.draggable = true;
      fileIcon.style.cursor = 'grab';
      fileIcon.addEventListener('dragstart', event => {
        if (solved) {
          event.preventDefault();
          return;
        }
        fileIcon.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', file.id);
      });
      fileIcon.addEventListener('dragend', () => {
        fileIcon.classList.remove('dragging');
        iconGrid.querySelectorAll('.drop-ready').forEach(icon => icon.classList.remove('drop-ready'));
      });

      iconGrid.querySelectorAll('[data-kind="folder"]').forEach(folderIcon => {
        folderIcon.addEventListener('dragover', event => {
          if (solved) return;
          event.preventDefault();
          event.dataTransfer.dropEffect = 'move';
          folderIcon.classList.add('drop-ready');
        });
        folderIcon.addEventListener('dragleave', () => folderIcon.classList.remove('drop-ready'));
        folderIcon.addEventListener('drop', event => {
          event.preventDefault();
          folderIcon.classList.remove('drop-ready');
          if (solved) return;
          const draggedId = event.dataTransfer.getData('text/plain');
          if (draggedId !== file.id) {
            markWrong('Povleci zahtevano datoteko.');
            return;
          }
          if (folderIcon.dataset.id !== folder.id) {
            markWrong('To ni prava mapa. Poskusi znova.');
            return;
          }
          fileIcon.classList.add('moved');
          folderIcon.classList.add('accepted');
          completeTask('Bravo! Datoteka je v pravi mapi.');
        });
      });
    }

    function setupBoxSelectionTask() {
      const pair = randomItem(selectionPairs);
      const names = pair.map(id => itemById(id).name);
      currentTask = { kind: 'box', targetIds: pair };
      instruction.innerHTML = 'Z vlečenjem pravokotnika označi ikoni <span class="target">' + names[0] + '</span> in <span class="target">' + names[1] + '</span>.';
      desktop.style.cursor = 'crosshair';

      desktop.addEventListener('pointerdown', startSelection);
    }

    function startSelection(event) {
      if (solved || currentTask?.kind !== 'box' || event.button !== 0) return;
      if (event.target !== desktop) return;
      event.preventDefault();
      clearSelectedIcons();
      desktop.querySelector('.selection-box')?.remove();

      const desktopRect = desktop.getBoundingClientRect();
      const startX = event.clientX - desktopRect.left;
      const startY = event.clientY - desktopRect.top;
      const box = document.createElement('div');
      box.className = 'selection-box';
      box.style.left = startX + 'px';
      box.style.top = startY + 'px';
      desktop.append(box);

      selectionState = { pointerId: event.pointerId, startX, startY, box };
      desktop.setPointerCapture(event.pointerId);
      desktop.addEventListener('pointermove', moveSelection);
      desktop.addEventListener('pointerup', endSelection, { once: true });
    }

    function moveSelection(event) {
      if (!selectionState || event.pointerId !== selectionState.pointerId) return;
      const desktopRect = desktop.getBoundingClientRect();
      const currentX = Math.max(0, Math.min(desktop.clientWidth, event.clientX - desktopRect.left));
      const currentY = Math.max(0, Math.min(desktop.clientHeight, event.clientY - desktopRect.top));
      const left = Math.min(selectionState.startX, currentX);
      const top = Math.min(selectionState.startY, currentY);
      const width = Math.abs(currentX - selectionState.startX);
      const height = Math.abs(currentY - selectionState.startY);
      Object.assign(selectionState.box.style, {
        left: left + 'px',
        top: top + 'px',
        width: width + 'px',
        height: height + 'px'
      });
    }

    function endSelection(event) {
      if (!selectionState || event.pointerId !== selectionState.pointerId) return;
      desktop.removeEventListener('pointermove', moveSelection);
      const selectionRect = selectionState.box.getBoundingClientRect();
      const selectedIds = [];

      iconGrid.querySelectorAll('.desktop-icon').forEach(icon => {
        const iconRect = icon.getBoundingClientRect();
        const intersects = !(
          selectionRect.right < iconRect.left ||
          selectionRect.left > iconRect.right ||
          selectionRect.bottom < iconRect.top ||
          selectionRect.top > iconRect.bottom
        );
        if (intersects) {
          icon.classList.add('selected');
          selectedIds.push(icon.dataset.id);
        }
      });

      selectionState.box.remove();
      selectionState = null;
      const correct = selectedIds.length === currentTask.targetIds.length &&
        currentTask.targetIds.every(id => selectedIds.includes(id));
      if (correct) completeTask('Odlično! Označil si obe pravi ikoni.');
      else markWrong('Poskusi znova. Pravokotnik naj zajame samo zahtevani ikoni.');
    }

    function setupContextTask() {
      const target = randomItem(desktopItems);
      const action = randomItem(contextActions);
      currentTask = { kind: 'context', targetId: target.id, action };
      instruction.innerHTML = 'Z desnim klikom klikni ikono <span class="target">' + target.name + '</span> in izberi <span class="target">' + action + '</span>.';

      desktop.addEventListener('contextmenu', event => event.preventDefault());
      iconGrid.querySelectorAll('.desktop-icon').forEach(icon => {
        icon.addEventListener('contextmenu', event => {
          event.preventDefault();
          desktop.querySelector('.context-menu')?.remove();
          if (solved) return;
          clearSelectedIcons();
          icon.classList.add('selected');
          if (icon.dataset.id !== target.id) {
            markWrong('Desni klik si uporabil na napačni ikoni.');
            return;
          }
          showContextMenu(icon, action);
        });
      });
    }

    function showContextMenu(icon, correctAction) {
      const menu = document.createElement('div');
      menu.className = 'context-menu';
      const desktopRect = desktop.getBoundingClientRect();
      const iconRect = icon.getBoundingClientRect();
      menu.style.left = Math.min(desktop.clientWidth - 185, iconRect.right - desktopRect.left) + 'px';
      menu.style.top = Math.min(desktop.clientHeight - 190, iconRect.top - desktopRect.top + 20) + 'px';

      contextActions.forEach(action => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = action;
        button.addEventListener('click', event => {
          event.stopPropagation();
          if (solved) return;
          if (action === correctAction) {
            menu.remove();
            completeTask('Bravo! Izbral si pravi ukaz.');
          } else {
            markWrong('To ni zahtevani ukaz. Poskusi znova.');
          }
        });
        menu.append(button);
      });
      desktop.append(menu);
    }

    desktop.addEventListener('click', event => {
      if (!event.target.closest('.context-menu') && currentTask?.kind === 'context') {
        desktop.querySelector('.context-menu')?.remove();
      }
    });

    nextButton.addEventListener('click', () => {
      desktop.style.cursor = '';
      newTask();
    });

    newTask();
  </script>
</body>
</html>
